<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Diary - Album Detail</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo-section">
        <a href="home.html" class="logo">Music Diary</a>
      </div>
      <nav>
        <a href="home.html">Home</a>
        <a href="albums.html">Albums</a>
        <button id="logout-btn" type="button">Logout</button>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="container">
      <a href="albums.html">← Back to albums</a>
      <div id="album-detail"></div>

      <form id="song-form" class="form-card">
        <h2>Add Song</h2>
        <div class="form-group">
          <label for="song-title">Title</label>
          <input id="song-title" name="title" required>
        </div>
        <div class="form-group">
          <label for="song-track">Track</label>
          <input id="song-track" name="track" type="number">
        </div>
        <div class="form-group">
          <label for="song-length">Length (seconds)</label>
          <input id="song-length" name="length" type="number">
        </div>
        <button type="submit">Create Song</button>
      </form>

      <div id="songs-list"></div>
    </div>
  </main>

  <script src="../js/myScripts.js"></script>
</body>
</html>
