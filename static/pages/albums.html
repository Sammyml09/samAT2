<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Diary - Albums</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo-section">
        <a href="home.html" class="logo">Music Diary</a>
      </div>
      <nav>
        <a href="home.html">Home</a>
        <a href="albums.html">Albums</a>
        <button id="logout-btn" type="button">Logout</button>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div class="container">
      <h1 class="page-title">My Albums</h1>
      <p id="status-message">Loading albums...</p>

      <form id="album-form" class="form-card">
        <h2>Create Album</h2>
        <div class="form-group">
          <label for="album-title">Title</label>
          <input id="album-title" name="title" required>
        </div>
        <div class="form-group">
          <label for="album-artist">Artist</label>
          <input id="album-artist" name="artist">
        </div>
        <div class="form-group">
          <label for="album-year">Year</label>
          <input id="album-year" name="year" type="number">
        </div>
        <button type="submit">Create Album</button>
      </form>

      <div id="albums-list"></div>
    </div>
  </main>

  <script src="../js/myScripts.js"></script>
</body>
</html>
