#          Enables song rating, commenting, and album metadata viewing.

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Music Diary - Album Details">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="../manifest.json">
    <title>Music Diary - Album Details</title>
    <link rel="stylesheet" href="../styles/myStyle.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-section">
                <a href="home.html" class="logo">Music Diary</a>
            </div>
            <nav>
                <a href="home.html">Home</a>
                <a href="albums.html">Albums</a>
                <button id="logoutBtn" style="cursor: pointer;">Logout</button>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <div class="container">
            <a href="albums.html" style="color: var(--primary-color); text-decoration: none; margin-bottom: 1rem; display: inline-block;">← Back to Albums</a>

            <div id="albumDetails">
                <!-- Album header and details will be rendered here -->
            </div>

            <div class="section-title">Add Song to Album 🎵</div>

            <div style="background: rgba(255, 255, 255, 0.02); padding: 1.5rem; border-radius: var(--radius); margin-bottom: 2rem;">
                <form id="addSongForm" style="display: none;">
                    <div class="form-group">
                        <label for="songName">Song Title *</label>
                        <input 
                            type="text" 
                            id="songName" 
                            placeholder="Enter song title"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="songRating">Rating (1-5 Stars) *</label>
                        <select id="songRating" required>
                            <option value="">Select a rating</option>
                            <option value="1">⭐ 1 Star</option>
                            <option value="2">⭐⭐ 2 Stars</option>
                            <option value="3">⭐⭐⭐ 3 Stars</option>
                            <option value="4">⭐⭐⭐⭐ 4 Stars</option>
                            <option value="5">⭐⭐⭐⭐⭐ 5 Stars</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="songComment">Song Comment</label>
                        <textarea 
                            id="songComment" 
                            placeholder="Share your thoughts about this song..."
                            rows="3"
                            style="resize: vertical;"
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Song</button>
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('addSongForm').style.display='none'" style="margin-left: 1rem;">Cancel</button>
                </form>

                <button id="toggleSongFormBtn" class="btn btn-secondary" style="width: auto;" onclick="toggleSongForm()">+ Add Song</button>
            </div>

            <div class="section-title">Songs in This Album 🎶</div>

            <div id="songsList" class="songs-list">
                <!-- Songs will be rendered here -->
            </div>
        </div>
    </main>

    <script src="../scripts/myScripts.js"></script>
   
   <script>
        // Album detail page specific functionality
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const albumId = urlParams.get('id'); // treat as string (UUID)
            
            if (!albumId || !appState.currentUser) {
                window.location.href = 'albums.html';
                return;
            }

            // Fetch album data from API to ensure we have current data
            fetch(`${API_BASE}/albums/${albumId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.album) {
                        // Update appState with the fresh album data
                        const existingIndex = appState.albums.findIndex(a => a.id === albumId);
                        if (existingIndex >= 0) {
                            appState.albums[existingIndex] = data.album;
                        } else {
                            appState.albums.push(data.album);
                        }
                        
                        // Fetch songs for this album
                        return fetch(`${API_BASE}/albums/${albumId}/songs`);
                    }
                    throw new Error('Album not found');
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success && data.songs) {
                        appState.songs[albumId] = data.songs;
                    }
                    displayAlbumDetail(albumId);
                })
                .catch(error => {
                    console.error('Error loading album:', error);
                    document.getElementById('albumDetails').innerHTML = '<p style="color: var(--error-color);">Failed to load album. <a href="albums.html">Go back</a></p>';
                });
        });

        function displayAlbumDetail(albumId) {
            const album = appState.albums.find(a => a.id === albumId);
            
            if (!album) {
                document.getElementById('albumDetails').innerHTML = '<p style="color: var(--error-color);">Album not found</p>';
                return;
            }

            const avgRating = calculateAlbumRating(appState.songs[albumId] || []);
            
            const detailsHTML = `
                <div class="album-header">
                    <div class="album-cover">🎵</div>
                    <div class="album-info">
                        <h1>${escapeHtml(album.name)}</h1>
                        <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">by ${escapeHtml(album.artist)}</p>
                        <p style="color: var(--text-secondary); margin-bottom: 1rem;">Released: ${album.year}</p>
                        
                        <div style="background: rgba(99, 102, 241, 0.1); padding: 1rem; border-radius: var(--radius); margin-bottom: 1rem;">
                            <strong style="color: var(--primary-color);">Average Rating:</strong>
                            <div style="font-size: 1.5rem; color: var(--warning-color);">
                                ${avgRating > 0 ? `⭐ ${avgRating}/5` : 'No ratings yet'}
                            </div>
                        </div>

                        ${album.comment ? `
                            <div style="border-left: 3px solid var(--primary-color); padding-left: 1rem; margin-top: 1rem;">
                                <p style="color: var(--text-secondary); font-style: italic;">"${escapeHtml(album.comment)}"</p>
                            </div>
                        ` : ''}

                        <div style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                            <button class="btn btn-secondary" onclick="editAlbum('${albumId}')" style="width: auto;">Edit Album</button>
                            <button class="btn btn-danger" onclick="confirmDeleteAlbum('${albumId}')" style="width: auto;">Delete Album</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('albumDetails').innerHTML = detailsHTML;
            
            // Store albumId in window for use in other functions
            window.currentAlbumId = albumId;

            // Update add-song form inputs to include album-scoped IDs and wire the submit to API-aware function
            (function wireSongForm() {
                const form = document.getElementById('addSongForm');
                if (!form) return;

                // Update input IDs to include albumId so myScripts.addSongToAlbum can find them
                const nameInput = document.getElementById('songName');
                const commentInput = document.getElementById('songComment');
                const ratingInput = document.getElementById('songRating');

                if (nameInput) nameInput.id = `songName-${albumId}`;
                if (commentInput) commentInput.id = `songComment-${albumId}`;
                if (ratingInput) ratingInput.id = `songRating-${albumId}`;

                // Ensure the form submits to the API-aware function
                form.onsubmit = function(e) { addSongToAlbum(e, albumId); return false; };
            })();

            // Render songs
            renderSongDetail(albumId);
        }

        function renderSongDetail(albumId) {
            const songs = appState.songs[albumId] || [];
            const container = document.getElementById('songsList');

            if (songs.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 2rem;">No songs added yet. Add one to get started!</p>';
                return;
            }

            container.innerHTML = songs.map(song => `
                <div class="song-item">
                    <div>
                        <div class="song-title">${escapeHtml(song.name)}</div>
                        <div style="color: var(--warning-color); font-weight: bold; margin: 0.5rem 0;">⭐ ${song.rating}/5</div>
                        ${song.comment ? `<div class="song-comment">"${escapeHtml(song.comment)}"</div>` : ''}
                    </div>
                    <button class="btn btn-danger btn-small" onclick="deleteSong('${albumId}', '${song.id}')">Delete</button>
                </div>
            `).join('');
        }

        function toggleSongForm() {
            const form = document.getElementById('addSongForm');
            const btn = document.getElementById('toggleSongFormBtn');
            
            if (form.style.display === 'none') {
                form.style.display = 'block';
                btn.textContent = '✕ Cancel';
            } else {
                form.style.display = 'none';
                btn.textContent = '+ Add Song';
            }
        }

        // addSongToAlbum is provided by scripts/myScripts.js and is wired to the form dynamically

        function confirmDeleteAlbum(albumId) {
            if (confirm('Are you sure you want to delete this album? This cannot be undone.')) {
                appState.albums = appState.albums.filter(a => a.id !== albumId);
                delete appState.songs[albumId];
                saveUserData();
                showAlert('Album deleted successfully', 'success');
                setTimeout(() => {
                    window.location.href = 'albums.html';
                }, 500);
            }
        }
    </script>
    <script>
        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js')
                    .then(registration => {
                        console.log('Service Worker registered:', registration);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
