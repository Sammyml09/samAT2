<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="Music Diary - Catalogue your music library">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Music Diary">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="images/logoMusicDiary.svg">
    <link rel="apple-touch-icon" href="images/logoMusicDiary.svg">
    <title>Music Diary - Login</title>
    <link rel="stylesheet" href="styles/myStyle.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-section">
                <a href="index.html" class="logo">Music Diary</a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <!-- Login Section -->
            <div id="loginSection" class="auth-form-section active">
                <h1>Welcome Back</h1>
                <p>Sign in to your Music Diary account</p>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginUsername">Username</label>
                        <input 
                            type="text" 
                            id="loginUsername" 
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>

                <div class="auth-toggle">
                    <p>Don't have an account? <button type="button" id="toggleToRegister" class="btn-link">Create one</button></p>
                </div>
            </div>

            <!-- Register Section -->
            <div id="registerSection" class="auth-form-section">
                <h1>Join Music Diary</h1>
                <p>Create your account to start cataloging your music</p>
                
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerUsername">Username</label>
                        <input 
                            type="text" 
                            id="registerUsername" 
                            placeholder="3-30 characters (letters, numbers, - _)"
                            required
                        >
                        <small>3-30 characters, alphanumeric, hyphens, and underscores only</small>
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input 
                            type="email" 
                            id="registerEmail" 
                            placeholder="your@email.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input 
                            type="password" 
                            id="registerPassword" 
                            placeholder="At least 8 characters"
                            required
                        >
                        <small>8-128 characters</small>
                    </div>

                    <div class="form-group">
                        <label for="registerPasswordConfirm">Confirm Password</label>
                        <input 
                            type="password" 
                            id="registerPasswordConfirm" 
                            placeholder="Re-enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary">Create Account</button>
                </form>

                <div class="auth-toggle">
                    <p>Already have an account? <button type="button" id="toggleToLogin" class="btn-link">Sign In</button></p>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/myScripts.js"></script>
    <script>
        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('Service Worker registered:', registration);
                    })
                    .catch(error => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
